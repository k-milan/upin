services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: upin
      POSTGRES_USER: upin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - upin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upin -d upin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  upin-postgres:
